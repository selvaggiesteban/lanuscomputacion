name = "lanus-flyers-updater"
main = "src/index.ts"
compatibility_date = "2026-06-14"
compatibility_flags = ["nodejs_compat"]

# Cron: 7:00 y 17:00 America/Argentina/Buenos_Aires (UTC-3) = 10:00 y 20:00 UTC
triggers = { crons = ["0 10,20 * * *"] }

[[kv_namespaces]]
binding = "FLYERS"
id = "62cb8b101cf74606bfb6f86ba12c6ba9"

[[d1_databases]]
binding = "DB"
database_name = "lanus-catalog"
database_id = "c0a53831-2932-4dc5-94d9-b37be72e8219"

# UPDATE_SECRET (trigger manual: GET /update con header x-update-secret):
# wrangler secret put UPDATE_SECRET
