<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { width: 80%; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .header { text-align: center; border-bottom: 2px solid #ffc107; padding-bottom: 10px; }
        .content { padding: 20px 0; }
        .footer { text-align: center; font-size: 0.8em; color: #777; margin-top: 20px; }
        .button { display: inline-block; padding: 10px 20px; background-color: #ffc107; color: #000; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
    <title>Abandoned Cart</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lanus Computación</h1>
        </div>
        <div class="content">
            <p>Hola <strong>{{ customer_name }}</strong>,</p>
            <p>Notamos que dejaste algunos productos en tu carrito. ¡No los pierdas!</p>
            <p>Puedes completar tu compra haciendo clic en el botón de abajo:</p>
            <div style="text-align: center; margin: 30px 0;">
                <a href="{{ cart_url }}" class="button">Volver a mi Carrito</a>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2026 Lanus Computación. Todos los derechos reservados.</p>
        </div>
    </div>
</body>
</html>
