<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { width: 80%; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .header { text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .content { padding: 20px 0; }
        .footer { text-align: center; font-size: 0.8em; color: #777; margin-top: 20px; }
        .button { display: inline-block; padding: 10px 20px; background-color: #007bff; color: #fff; text-decoration: none; border-radius: 5px; }
    </style>
    <title>Post-Purchase Service</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lanus Computación</h1>
        </div>
        <div class="content">
            <p>Hola <strong>{{ customer_name }}</strong>,</p>
            <p>¡Gracias por confiar en nosotros! Tu pedido <strong>#{{ order_id }}</strong> ha sido recibido y estamos trabajando en él.</p>
            <p>Te mantendremos informado sobre el estado de tu envío.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 Lanus Computación. Todos los derechos reservados.</p>
        </div>
    </div>
</body>
</html>
